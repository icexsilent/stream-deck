<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1012">
<title>Stream Deck</title>
<link rel="stylesheet" href="/theme.css">
<style>
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-direction: column; gap: var(--s3); padding: var(--s3) var(--s4); background: var(--bg); }
  #tabs { display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: none; }
  #grid { display: grid; gap: var(--s3); padding: 0 var(--s4) var(--s5); }
  #msg { padding: var(--s6) var(--s4); text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <span id="status" class="status">Conectando…</span>
  <nav id="tabs" role="tablist" aria-label="Páginas"></nav>
</header>
<main id="grid"></main>
<p id="msg" hidden></p>
<script type="module">
import { keyTile, updateLive } from '/keytile.js';

const token = new URLSearchParams(location.search).get('t') || '';
const $ = (id) => document.getElementById(id);
const iconUrl = (f) => `/icon/${encodeURIComponent(f)}?t=${encodeURIComponent(token)}`;
let ws, cfg, pageIdx = 0, live = {};

function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = Object.assign(document.createElement('div'), { className: 'toast err', role: 'alert', textContent: msg });
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

function flash(id, cls) {
  const el = $('grid').querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!el) return;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 220);
}

function render() {
  pageIdx = Math.min(pageIdx, cfg.pages.length - 1);
  $('tabs').replaceChildren(...(cfg.pages.length > 1 ? cfg.pages.map((p, i) => Object.assign(document.createElement('button'), {
    className: 'chip', role: 'tab', textContent: p.auto ? `🎮 ${p.name}` : p.name, ariaSelected: String(i === pageIdx),
    onclick: () => { pageIdx = i; render(); },
  })) : []));
  const p = cfg.pages[pageIdx];
  $('grid').style.gridTemplateColumns = `repeat(${cfg.columns}, 1fr)`;
  $('grid').replaceChildren(...p.buttons.map((b) => {
    const el = keyTile(b, iconUrl, live[b.id]);
    // Widgets use long press too (zero the counter, reset the timer, next song).
    let timer, longFired = false;
    if (b.type === 'widget') {
      el.onpointerdown = () => { longFired = false; timer = setTimeout(() => { longFired = true; navigator.vibrate?.(60); ws.send(JSON.stringify({ type: 'press', id: b.id, long: true })); }, 550); };
      el.onpointerup = el.onpointerleave = () => clearTimeout(timer);
      el.oncontextmenu = (e) => e.preventDefault();
    }
    el.onclick = () => {
      if (longFired) return;
      navigator.vibrate?.(20);
      if (b.type === 'page') {
        const to = cfg.pages.findIndex((x) => x.name === b.page);
        if (to >= 0) { pageIdx = to; render(); }
        return;
      }
      ws.send(JSON.stringify({ type: 'press', id: b.id }));
    };
    return el;
  }));
  $('msg').hidden = p.buttons.length > 0;
  $('msg').textContent = p.auto ? (cfg.scanning ? 'Procurando jogos…' : 'Nenhum jogo encontrado no PC.') : 'Página vazia. Crie botões no editor do PC ou no app.';
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/?t=${encodeURIComponent(token)}`);
  ws.onopen = () => { $('status').textContent = 'Conectado'; $('status').className = 'status on'; };
  ws.onclose = (e) => {
    $('status').className = 'status';
    if (e.code === 4001) { $('status').textContent = 'Link inválido: leia o QR code do PC de novo'; return; }
    $('status').textContent = 'Desconectado, tentando de novo…';
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'config') { cfg = msg.config; render(); }
    else if (msg.type === 'live') {
      live = msg.values;
      for (const [id, v] of Object.entries(live)) {
        const el = $('grid').querySelector(`[data-id="${CSS.escape(id)}"]`);
        if (el) updateLive(el, v);
      }
    }
    else if (msg.type === 'ok') flash(msg.id, 'hit');
    else if (msg.type === 'error') { if (msg.id) flash(msg.id, 'err'); toast(msg.error); }
  };
}
connect();
</script>
</body>
</html>
