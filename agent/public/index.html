<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Stream Deck</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  #status { padding: 8px 16px; font-size: 14px; color: #f66; }
  #status.on { color: #6f6; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 16px; }
  button { aspect-ratio: 1; border: 0; border-radius: 16px; background: #2a2a2a; color: inherit; font-size: 18px; touch-action: manipulation; }
  button:active, button.hit { background: #4a6cf7; }
  button.err { background: #a33; }
</style>
</head>
<body>
<div id="status">Conectando…</div>
<div id="grid"></div>
<script>
const token = new URLSearchParams(location.search).get('t');
const status = document.getElementById('status');
const grid = document.getElementById('grid');
let ws;

function flash(id, cls) {
  const el = grid.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!el) return;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 200);
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/?t=${encodeURIComponent(token || '')}`);
  ws.onopen = () => { status.textContent = 'Conectado'; status.className = 'on'; };
  ws.onclose = (e) => {
    status.className = '';
    if (e.code === 4001) { status.textContent = 'Token inválido: use o link que o PC mostrou'; return; }
    status.textContent = 'Desconectado, tentando de novo…';
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'buttons') {
      grid.replaceChildren(...msg.buttons.map((b) => {
        const el = document.createElement('button');
        el.textContent = b.label;
        el.dataset.id = b.id;
        el.onclick = () => { ws.send(JSON.stringify({ type: 'press', id: b.id })); navigator.vibrate?.(30); };
        return el;
      }));
    } else if (msg.type === 'ok') flash(msg.id, 'hit');
    else if (msg.type === 'error') flash(msg.id, 'err');
  };
}
connect();
</script>
</body>
</html>
