<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Deck</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body { height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0 var(--s2) 0 0; }
  header .spacer { flex: 1; }
  #dirty { font-size: 13px; color: var(--accent); }
  main { display: grid; grid-template-columns: 220px 1fr 320px; min-height: 0; }
  aside, section { min-height: 0; overflow: auto; }
  #pages { border-right: 1px solid var(--border); padding: var(--s4) var(--s3); display: flex; flex-direction: column; gap: var(--s1); }
  #pages h2, #inspector h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 var(--s2) var(--s2); }
  .page-item { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: var(--s2) var(--s3); border: 0; border-radius: var(--r-panel); background: transparent; text-align: left; cursor: pointer; }
  .page-item:hover { background: var(--raised); }
  .page-item[aria-current="true"] { background: var(--raised); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
  .page-item small { color: var(--muted); }
  #pages .btn { margin-top: var(--s2); justify-content: center; }
  #canvas { padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4); align-items: center; }
  #pagebar { display: flex; align-items: center; gap: var(--s2); width: min(100%, 640px); }
  #pagebar select, .cols-lbl { font-size: 13px; color: var(--muted); }
  #pagebar select { padding: var(--s2); background: var(--raised); color: var(--text); border: 1px solid var(--border); border-radius: var(--r-panel); }
  #pagebar input { flex: 1; min-width: 0; padding: var(--s2) var(--s3); background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-panel); font-size: 18px; font-weight: 600; }
  #device { width: min(100%, 640px); padding: var(--s4); background: #08090a; border: 1px solid var(--border); border-radius: 20px; }
  #grid { display: grid; gap: var(--s3); }
  #grid .key[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  #grid .key.dragging { opacity: .4; }
  #grid .key.drop { outline: 2px dashed var(--accent); }
  .add-key { aspect-ratio: 1; border: 2px dashed var(--border); border-radius: var(--r-key); background: transparent; color: var(--muted); font-size: 32px; cursor: pointer; }
  .add-key:hover { border-color: var(--muted); color: var(--text); }
  #hint { color: var(--muted); font-size: 13px; text-align: center; }
  #inspector { border-left: 1px solid var(--border); padding: var(--s4); background: var(--panel); }
  .field { display: flex; flex-direction: column; gap: var(--s1); margin-bottom: var(--s4); }
  .field label, .field .lbl { font-size: 13px; color: var(--muted); }
  .field input[type=text], .field select { padding: var(--s2) var(--s3); background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-panel); }
  .field .help { font-size: 12px; color: var(--muted); }
  .row { display: flex; gap: var(--s2); align-items: center; }
  .row input { flex: 1; min-width: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch[aria-checked="true"] { border-color: var(--text); }
  .icon-preview { width: 56px; height: 56px; border-radius: var(--r-key); background: var(--key) center/cover no-repeat; border: 1px solid var(--border); }
  .game-row { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) 0; border-bottom: 1px solid var(--border); }
  .game-row img, .game-row .ph { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; background: var(--key); flex: none; }
  .game-row span { flex: 1; min-width: 0; }
  .game-row small { display: block; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: var(--s6) var(--s4); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: var(--r-panel); padding: var(--s5); text-align: center; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog img { width: 260px; height: 260px; background: #fff; padding: var(--s3); border-radius: var(--r-panel); }
  #histDlg { width: min(520px, calc(100% - 32px)); text-align: left; }
  #histDlg h2 { margin: 0 0 var(--s2); font-size: 18px; }
  #histDlg p { color: var(--muted); margin: 0 0 var(--s4); }
  .hist-row { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) 0; border-bottom: 1px solid var(--border); }
  .hist-row span { flex: 1; }
  .hist-row small { display: block; color: var(--muted); }
  #histList { max-height: 60vh; overflow: auto; }
  #setDlg { width: min(440px, calc(100% - 32px)); text-align: left; }
  #setDlg h2 { margin: 0 0 var(--s2); font-size: 18px; }
  #setDlg p { color: var(--muted); margin: 0 0 var(--s4); }
  .opt { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3); border: 1px solid var(--border); border-radius: var(--r-panel); margin-bottom: var(--s2); cursor: pointer; }
  .opt input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); }
  .opt small { display: block; color: var(--muted); }
  .preset { margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--border); }
  .actions { display: flex; gap: var(--s2); justify-content: flex-end; margin-top: var(--s4); flex-wrap: wrap; }
  #offline { display: none; position: fixed; inset: auto 0 0 0; padding: var(--s2); text-align: center; background: var(--danger); color: #fff; font-size: 13px; }
  body.offline #offline { display: block; }
  .recording { border-color: var(--accent) !important; }
</style>
</head>
<body>
<header>
  <h1>Stream Deck</h1>
  <span id="conn" class="status">Conectando…</span>
  <span class="spacer"></span>
  <span id="dirty" hidden>Alterações não salvas</span>
  <button class="btn" id="addApp" title="Escolher um .exe ou atalho e criar um botão que abre ele">➕ Adicionar programa</button>
  <button class="btn" id="rescan" title="Procurar jogos instalados de novo">🎮 Procurar jogos</button>
  <button class="btn" id="pair">📱 Parear celular</button>
  <button class="btn" id="history" title="Ver e voltar versões anteriores (Ctrl+Z desfaz)">🕘 Histórico</button>
  <button class="btn icon" id="settings" title="Configurações" aria-label="Configurações">⚙️</button>
  <button class="btn primary" id="save" disabled title="Ctrl+S">Salvar</button>
</header>
<main>
  <aside id="pages" aria-label="Páginas"></aside>
  <section id="canvas" aria-label="Botões da página"></section>
  <aside id="inspector" aria-label="Propriedades"></aside>
</main>
<dialog id="pairDlg">
  <h2>Leia no app do celular</h2>
  <img id="pairImg" alt="QR code de pareamento">
  <p><button class="btn" onclick="pairDlg.close()">Fechar</button></p>
</dialog>
<dialog id="setDlg" aria-labelledby="setTitle"><form method="dialog" id="setForm"></form></dialog>
<dialog id="histDlg" aria-labelledby="histTitle"><form method="dialog" id="histForm"></form></dialog>
<div id="offline" role="alert">Sem conexão com o agente. Tentando de novo…</div>
<script type="module">
import { keyTile, updateLive } from '/keytile.js';

const TOKEN = '__TOKEN__';
const PALETTE = ['#26282d', '#3a3f47', '#2563eb', '#0d9488', '#16a34a', '#ca8a04', '#ea580c', '#dc2626', '#db2777', '#7c3aed'];
const TYPES = { hotkey: 'Atalho de teclado', open: 'Abrir programa, arquivo ou site', game: 'Abrir jogo', obs: 'OBS', page: 'Ir para outra página', widget: 'Widget ao vivo', plugin: 'Plugin' };
// Same list as agent/widgets.js KINDS; the hint says what a tap / long press does.
const WIDGETS = {
  clock: ['Relógio', 'Mostra a hora e a data do PC.'],
  cpu: ['Uso da CPU', 'Toque abre o Gerenciador de Tarefas.'],
  ram: ['Uso da memória RAM', 'Toque abre o Gerenciador de Tarefas.'],
  gpu: ['Uso da placa de vídeo', 'Uso e temperatura (NVIDIA). Toque abre o Gerenciador de Tarefas.'],
  media: ['Música tocando', 'Spotify, YouTube, etc. Toque: play/pause. Segure: próxima.'],
  volume: ['Volume do PC', 'Toque: mudo liga/desliga.'],
  timer: ['Cronômetro', 'Toque: inicia/pausa. Segure: zera.'],
  counter: ['Contador', 'Toque: +1. Segure: zera.'],
  weather: ['Clima', 'Temperatura agora na cidade escolhida.'],
};
const OBS = { toggleStream: 'Ligar/desligar live', toggleRecord: 'Ligar/desligar gravação', scene: 'Trocar de cena', toggleMute: 'Mutar/desmutar fonte de áudio' };
const $ = (s) => document.querySelector(s);
const h = (tag, props = {}, ...kids) => { const el = Object.assign(document.createElement(tag), props); el.append(...kids.filter((k) => k != null)); return el; };
// replaceChildren prints null as the text "null"; this skips conditional parts that are off.
const fill = (el, ...kids) => el.replaceChildren(...kids.filter((k) => k != null));
const iconUrl = (f) => `/icon/${encodeURIComponent(f)}`;

let live = {};
let ws, server, draft, dirty = false, pendingSave = false, pageIdx = 0, sel = null, recording = false;

function toast(msg, err = false) {
  document.querySelector('.toast')?.remove();
  const t = h('div', { className: 'toast' + (err ? ' err' : ''), role: 'status', textContent: msg });
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

function setDirty(v = true) { dirty = v; $('#dirty').hidden = !v; $('#save').disabled = !v; }
const change = (fn) => { fn(); setDirty(); render(); };

function fromServer(cfg) {
  server = cfg;
  if (dirty) return toast('Os botões mudaram em outro aparelho. Salve para sobrescrever ou recarregue a página.');
  draft = structuredClone({ columns: cfg.columns, pages: cfg.pages.filter((p) => !p.auto), hiddenGames: cfg.hiddenGames ?? [] });
  render();
}

// ---- pages sidebar ----
function renderPages() {
  const games = server?.games ?? [];
  const items = draft.pages.map((p, i) => h('button', { className: 'page-item', ariaCurrent: String(i === pageIdx), onclick: () => { pageIdx = i; sel = null; render(); } },
    h('span', { textContent: p.name }), h('small', { textContent: p.buttons.length })));
  if (server?.features?.games) items.push(h('button', { className: 'page-item', ariaCurrent: String(pageIdx === 'games'), onclick: () => { pageIdx = 'games'; sel = null; render(); } },
    h('span', { textContent: '🎮 Jogos' }), h('small', { textContent: server?.scanning ? '…' : games.length - draft.hiddenGames.length })));
  $('#pages').replaceChildren(h('h2', { textContent: 'Páginas' }), ...items,
    h('button', { className: 'btn', textContent: '+ Nova página', onclick: () => change(() => { draft.pages.push({ name: `Página ${draft.pages.length + 1}`, buttons: [] }); pageIdx = draft.pages.length - 1; sel = null; }) }));
}

// ---- canvas ----
function renderCanvas() {
  const c = $('#canvas');
  if (pageIdx === 'games') return renderGames(c);
  const p = draft.pages[pageIdx];
  const grid = h('div', { id: 'grid' });
  grid.style.gridTemplateColumns = `repeat(${draft.columns}, 1fr)`;
  p.buttons.forEach((b, i) => {
    const k = keyTile(b, iconUrl, live[b.id]);
    k.ariaPressed = String(sel === i);
    k.title = `${b.label} — ${TYPES[b.type]}`;
    k.draggable = true;
    k.onclick = () => { sel = i; render(); };
    k.ondragstart = (e) => { e.dataTransfer.setData('text/plain', i); k.classList.add('dragging'); };
    k.ondragend = () => k.classList.remove('dragging');
    k.ondragover = (e) => { e.preventDefault(); k.classList.add('drop'); };
    k.ondragleave = () => k.classList.remove('drop');
    k.ondrop = (e) => {
      e.preventDefault();
      const from = Number(e.dataTransfer.getData('text/plain'));
      if (from === i) return;
      change(() => { p.buttons.splice(i, 0, p.buttons.splice(from, 1)[0]); sel = i; });
    };
    grid.append(k);
  });
  grid.append(h('button', { className: 'add-key', ariaLabel: 'Adicionar botão', textContent: '+', onclick: addKey }));
  const bar = h('div', { id: 'pagebar' },
    h('input', { type: 'text', value: p.name, ariaLabel: 'Nome da página', maxLength: 30, oninput: (e) => { p.name = e.target.value; setDirty(); renderPages(); } }),
    h('button', { className: 'btn icon', title: 'Mover página para cima', ariaLabel: 'Mover página para cima', textContent: '↑', disabled: pageIdx === 0, onclick: () => change(() => { draft.pages.splice(pageIdx - 1, 0, draft.pages.splice(pageIdx, 1)[0]); pageIdx--; }) }),
    h('button', { className: 'btn icon danger', title: 'Apagar página', ariaLabel: 'Apagar página', textContent: '🗑', disabled: draft.pages.length < 2,
      onclick: () => confirm(`Apagar a página "${p.name}" e seus ${p.buttons.length} botões?`) && change(() => { draft.pages.splice(pageIdx, 1); pageIdx = 0; sel = null; }) }),
    h('label', { htmlFor: 'f-cols', className: 'cols-lbl', textContent: 'Colunas' }),
    h('select', { id: 'f-cols', onchange: (e) => change(() => { draft.columns = Number(e.target.value); }) },
      ...[2, 3, 4, 5, 6, 7, 8].map((n) => h('option', { value: n, textContent: n, selected: n === draft.columns }))));
  c.replaceChildren(bar, h('div', { id: 'device' }, grid),
    h('p', { id: 'hint', textContent: p.buttons.length ? 'Clique num botão para editar. Arraste para reordenar. Delete apaga o selecionado.' : 'Página vazia: clique em + para criar o primeiro botão.' }));
}

function renderGames(c) {
  const games = server?.games ?? [];
  const hidden = new Set(draft.hiddenGames);
  if (server?.scanning) return c.replaceChildren(h('p', { className: 'empty', textContent: 'Procurando jogos instalados…' }));
  if (!games.length) return c.replaceChildren(h('p', { className: 'empty', textContent: 'Nenhum jogo encontrado. Funciona com Steam, Epic, Riot e Xbox. Instalou algo agora? Clique em 🎮 Procurar jogos.' }));
  c.replaceChildren(h('div', { style: 'width:min(100%,640px)' },
    h('p', { id: 'hint', textContent: 'Esta página é montada sozinha com os jogos do PC. Desmarque os que não quer no celular.' }),
    ...games.map((g) => h('label', { className: 'game-row' },
      g.icon ? h('img', { src: iconUrl(g.icon), alt: '' }) : h('span', { className: 'ph' }),
      h('span', {}, g.label, h('small', { textContent: g.source })),
      h('input', { type: 'checkbox', checked: !hidden.has(g.id), ariaLabel: `Mostrar ${g.label}`,
        onchange: (e) => change(() => { draft.hiddenGames = e.target.checked ? draft.hiddenGames.filter((x) => x !== g.id) : [...draft.hiddenGames, g.id]; }) })))));
}

// The agent opens the Windows file picker on this PC and returns the path, program name and icon.
async function pickApp() {
  const btn = $('#addApp');
  btn.disabled = true;
  toast('Escolha o programa na janela que abriu no PC…');
  try {
    const r = await fetch('/api/pick-app', { method: 'POST' });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error);
    return body.cancelled ? null : body;
  } catch (e) {
    toast(`Não abriu a janela de escolher programa: ${e.message}`, true);
    return null;
  } finally {
    btn.disabled = false;
    document.querySelector('.toast:not(.err)')?.remove();
  }
}

async function addApp() {
  if (pageIdx === 'games') pageIdx = 0;
  const app = await pickApp();
  if (!app) return;
  const p = draft.pages[pageIdx];
  change(() => {
    p.buttons.push({ id: `b${Date.now().toString(36)}`, label: app.label, type: 'open', target: app.target, ...(app.icon ? { icon: app.icon } : {}) });
    sel = p.buttons.length - 1;
  });
  toast(`"${app.label}" adicionado. Clique em Salvar para mandar ao celular.`);
}

function addKey() {
  const p = draft.pages[pageIdx];
  change(() => { p.buttons.push({ id: `b${Date.now().toString(36)}`, label: 'Novo botão', type: 'hotkey', keys: '' }); sel = p.buttons.length - 1; });
  setTimeout(() => $('#f-label')?.select(), 0);
}

// ---- inspector ----
const field = (label, input, help, id) => h('div', { className: 'field' }, h('label', { htmlFor: id, textContent: label }), input, help ? h('span', { className: 'help', textContent: help }) : null);
const text = (id, value, oninput, placeholder = '') => h('input', { type: 'text', id, value: value ?? '', placeholder, oninput });
const select = (id, value, opts, onchange) => h('select', { id, onchange }, ...Object.entries(opts).map(([v, t]) => h('option', { value: v, textContent: t, selected: v === value })));

// Turns a key press into the agent's hotkey syntax, e.g. Ctrl+Shift+M -> "ctrl+shift+m".
function comboFrom(e) {
  const names = { Escape: 'esc', ' ': 'space', Enter: 'enter', Tab: 'tab', Backspace: 'backspace', ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    PrintScreen: 'printscreen', MediaPlayPause: 'playpause', MediaTrackNext: 'next', MediaTrackPrevious: 'prev', AudioVolumeUp: 'volumeup', AudioVolumeDown: 'volumedown', AudioVolumeMute: 'mute' };
  if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return null;
  let k = names[e.key] ?? (/^F\d{1,2}$/.test(e.key) ? e.key.toLowerCase() : /^Key[A-Z]$/.test(e.code) ? e.code.slice(3).toLowerCase() : /^Digit\d$/.test(e.code) ? e.code.slice(5) : null);
  if (!k) return null;
  return [e.ctrlKey && 'ctrl', e.shiftKey && 'shift', e.altKey && 'alt', e.metaKey && 'win', k].filter(Boolean).join('+');
}

function renderInspector() {
  const ins = $('#inspector');
  if (pageIdx === 'games' || sel === null || !draft.pages[pageIdx]?.buttons[sel]) {
    return ins.replaceChildren(h('h2', { textContent: 'Propriedades' }), h('p', { className: 'empty', textContent: 'Selecione um botão para editar.' }));
  }
  const p = draft.pages[pageIdx];
  const b = p.buttons[sel];
  const set = (k) => (e) => { b[k] = e.target.value; setDirty(); renderCanvas(); };
  const typeFields = {
    hotkey: () => {
      const input = text('f-keys', b.keys, set('keys'), 'ctrl+shift+m');
      const rec = h('button', { className: 'btn', textContent: '⏺ Gravar', onclick: () => {
        recording = true; input.classList.add('recording'); input.value = 'Aperte o atalho…'; input.focus();
        const onKey = (e) => { const c = comboFrom(e); if (!c) return; e.preventDefault(); recording = false; window.removeEventListener('keydown', onKey, true); b.keys = c; setDirty(); render(); };
        window.addEventListener('keydown', onKey, true);
      } });
      return field('Teclas', h('div', { className: 'row' }, input, rec), 'Clique em Gravar e aperte o atalho, ou digite: ctrl shift alt win, a-z, 0-9, f1-f24, enter, esc, space, volumeup, mute, playpause…', 'f-keys');
    },
    open: () => field('Programa, arquivo ou site', h('div', { className: 'row' }, text('f-target', b.target, set('target'), 'calc.exe'),
      h('button', { className: 'btn', textContent: 'Procurar…', onclick: async () => {
        const app = await pickApp();
        if (!app) return;
        change(() => {
          b.target = app.target;
          if (!b.label || b.label === 'Novo botão') b.label = app.label;
          if (app.icon && !b.icon) b.icon = app.icon;
        });
      } })), 'Clique em Procurar e escolha o .exe, ou digite: notepad.exe, https://youtube.com', 'f-target'),
    game: () => {
      const games = server?.games ?? [];
      return field('Jogo', select('f-game', b.game, { '': 'Escolha…', ...Object.fromEntries(games.map((g) => [g.id, `${g.label} (${g.source})`])) }, (e) => {
        const g = games.find((x) => x.id === e.target.value);
        change(() => { b.game = e.target.value; if (g) { if (!b.label || b.label === 'Novo botão') b.label = g.label; if (g.icon && !b.icon) b.icon = g.icon; } });
      }), games.length ? null : 'Nenhum jogo detectado ainda.', 'f-game');
    },
    obs: () => h('div', {},
      field('Ação', select('f-obs', b.action ?? 'toggleStream', OBS, (e) => change(() => { b.action = e.target.value; })), null, 'f-obs'),
      ['scene', 'toggleMute'].includes(b.action) ? field(b.action === 'scene' ? 'Nome da cena' : 'Nome da fonte de áudio', text('f-name', b.name, set('name')), 'Exatamente como aparece no OBS', 'f-name') : null),
    widget: () => h('div', {},
      field('Widget', select('f-widget', b.widget ?? 'clock', Object.fromEntries(Object.entries(WIDGETS).map(([k, [n]]) => [k, n])), (e) => change(() => {
        b.widget = e.target.value;
        if (!b.label || b.label === 'Novo botão' || Object.values(WIDGETS).some(([n]) => n === b.label)) b.label = WIDGETS[b.widget][0];
      })), WIDGETS[b.widget ?? 'clock'][1], 'f-widget'),
      b.widget === 'timer' ? field('Minutos', h('input', { type: 'number', id: 'f-min', min: 1, max: 600, value: b.minutes ?? 5, oninput: (e) => { b.minutes = Number(e.target.value); setDirty(); } }), null, 'f-min') : null,
      b.widget === 'weather' ? field('Cidade', text('f-city', b.city, set('city'), 'São Paulo'), 'Nome da cidade, ex.: Campinas, Lisboa', 'f-city') : null),
    plugin: () => {
      const list = server?.plugins ?? [];
      if (!list.length) return h('p', { className: 'help', textContent: 'Nenhum plugin instalado. Veja ⚙️ Configurações → Plugins.' });
      const key = b.plugin && b.action ? `${b.plugin}/${b.action}` : '';
      const opts = { '': 'Escolha…', ...Object.fromEntries(list.flatMap((pl) => Object.entries(pl.actions).map(([aid, a]) => [`${pl.id}/${aid}`, `${pl.name} › ${a.label}`]))) };
      const pl = list.find((x) => x.id === b.plugin);
      const action = pl?.actions[b.action];
      b.params ??= {};
      // Form fields come from the plugin's own plugin.json.
      const input = (f) => {
        const id = `f-p-${f.key}`;
        const set = (e) => { b.params[f.key] = f.type === 'number' ? Number(e.target.value) : e.target.value; setDirty(); };
        if (f.type === 'select') return select(id, String(b.params[f.key] ?? f.default ?? f.options[0]), Object.fromEntries(f.options.map((o) => [o, o])), set);
        if (f.type === 'textarea') return h('textarea', { id, rows: 3, value: b.params[f.key] ?? '', placeholder: f.placeholder ?? '', oninput: set, style: 'padding:var(--s2) var(--s3);background:var(--raised);border:1px solid var(--border);border-radius:var(--r-panel);color:var(--text);font:inherit;resize:vertical' });
        return h('input', { type: f.type === 'number' ? 'number' : 'text', id, value: b.params[f.key] ?? '', placeholder: f.placeholder ?? '', oninput: set });
      };
      return h('div', {},
        field('Ação do plugin', select('f-plugin', key, opts, (e) => change(() => {
          const [pid, aid] = e.target.value.split('/');
          Object.assign(b, { plugin: pid, action: aid, params: {} });
          const a = list.find((x) => x.id === pid)?.actions[aid];
          if (a && (!b.label || b.label === 'Novo botão')) b.label = a.label;
        })), action?.description ?? pl?.description, 'f-plugin'),
        ...(action?.fields ?? []).map((f) => field(f.required ? `${f.label} *` : f.label, input(f), null, `f-p-${f.key}`)));
    },
    page: () => field('Página', select('f-page', b.page, { '': 'Escolha…', ...Object.fromEntries([...draft.pages.map((x) => x.name), 'Jogos'].map((n) => [n, n])) }, (e) => change(() => { b.page = e.target.value; })), null, 'f-page'),
  };
  const upload = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,image/gif', className: 'sr-only', id: 'f-file', onchange: async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = await fetch('/api/icon', { method: 'POST', headers: { 'content-type': f.type }, body: f });
    if (!r.ok) return toast(`Imagem não enviada: ${await r.text()}`, true);
    const { icon } = await r.json();
    change(() => { b.icon = icon; });
  } });
  fill(ins,
    h('h2', { textContent: 'Botão' }),
    field('Texto', h('input', { type: 'text', id: 'f-label', value: b.label, maxLength: 40, oninput: set('label') }), 'Pode usar emoji 🎮', 'f-label'),
    h('div', { className: 'field' }, h('span', { className: 'lbl', textContent: 'Imagem' }),
      h('div', { className: 'row' },
        h('div', { className: 'icon-preview', style: b.icon ? `background-image:url(${iconUrl(b.icon)})` : '' }),
        h('label', { className: 'btn', htmlFor: 'f-file', textContent: 'Escolher…' }), upload,
        b.icon ? h('button', { className: 'btn', textContent: 'Remover', onclick: () => change(() => { delete b.icon; }) }) : null)),
    h('div', { className: 'field' }, h('span', { className: 'lbl', textContent: 'Cor de fundo' }),
      h('div', { className: 'swatches', role: 'radiogroup', ariaLabel: 'Cor de fundo' }, ...PALETTE.map((c, i) => h('button', {
        className: 'swatch', role: 'radio', ariaLabel: i === 0 ? 'padrão' : c, ariaChecked: String((b.color ?? PALETTE[0]) === c), style: `background:${c}`,
        onclick: () => change(() => { if (i === 0) delete b.color; else b.color = c; }) })))),
    field('Ação', select('f-type', b.type, TYPES, (e) => change(() => {
      b.type = e.target.value;
      if (b.type === 'obs') b.action ??= 'toggleStream';
      if (b.type === 'widget') { b.widget ??= 'clock'; if (b.label === 'Novo botão') b.label = WIDGETS[b.widget][0]; }
    })), null, 'f-type'),
    typeFields[b.type](),
    draft.pages.length > 1 ? field('Mover para a página', select('f-move', String(pageIdx), Object.fromEntries(draft.pages.map((x, i) => [i, x.name])), (e) => change(() => {
      const to = Number(e.target.value);
      draft.pages[to].buttons.push(p.buttons.splice(sel, 1)[0]);
      pageIdx = to; sel = draft.pages[to].buttons.length - 1;
    })), null, 'f-move') : null,
    h('div', { className: 'row' },
      h('button', { className: 'btn', textContent: 'Duplicar', onclick: () => change(() => { p.buttons.splice(sel + 1, 0, { ...structuredClone(b), id: `b${Date.now().toString(36)}` }); sel++; }) }),
      h('button', { className: 'btn danger', textContent: 'Apagar botão', onclick: () => change(() => { p.buttons.splice(sel, 1); sel = null; }) })),
  );
}

function render() {
  if (!draft) return;
  if ((pageIdx === 'games' && !server.features?.games) || (pageIdx !== 'games' && pageIdx >= draft.pages.length)) pageIdx = 0;
  renderPages(); renderCanvas(); renderInspector();
}

// ---- histórico (Plandex-style): every change can be undone ----
function undo() {
  if (dirty) return toast('Você tem alterações não salvas. Salve ou recarregue antes de desfazer.', true);
  ws.send(JSON.stringify({ type: 'undo' }));
  toast('Desfeito. Ctrl+Z de novo volta mais um passo.');
}
function openHistory(items) {
  const when = (t) => new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  fill($('#histForm'),
    h('h2', { id: 'histTitle', textContent: '🕘 Histórico' }),
    h('p', { textContent: 'Antes de cada mudança o Stream Deck guarda como estava. Escolha uma versão para voltar a ela (dá para desfazer a volta também).' }),
    items.length
      ? h('div', { id: 'histList' }, ...items.map((it) => h('div', { className: 'hist-row' },
          h('span', {}, `Antes de ${it.source}`, h('small', { textContent: `${when(it.at)} · ${it.pages} páginas, ${it.buttons} botões` })),
          h('button', { type: 'button', className: 'btn', textContent: 'Voltar para esta', onclick: () => {
            if (dirty) return toast('Salve ou descarte suas alterações antes.', true);
            ws.send(JSON.stringify({ type: 'restore', id: it.id }));
            $('#histDlg').close();
            toast('Versão restaurada ✅');
          } }))))
      : h('p', { textContent: 'Nada ainda. As versões aparecem aqui depois da primeira mudança salva.' }),
    h('div', { className: 'actions' }, h('button', { className: 'btn', textContent: 'Fechar', value: 'close' })));
  $('#histDlg').showModal();
}

// ---- first run + Configurações (same dialog; the first run just has different wording) ----
let setupShown = false;
function openSettings(firstRun = false) {
  if (dirty) return toast('Salve ou descarte suas alterações antes de mudar as configurações.', true);
  const f = server.features ?? {};
  const preset = server.creatorPreset;
  const opt = (id, checked, title, desc) => h('label', { className: 'opt' }, h('input', { type: 'checkbox', id, checked }), h('span', {}, h('strong', { textContent: title }), h('small', { textContent: desc })));
  const send = (msg) => { ws.send(JSON.stringify(msg)); $('#setDlg').close(); };
  const apply = () => send({ type: 'setFeatures', features: { games: $('#o-games').checked, obs: $('#o-obs').checked, widgets: $('#o-widgets').checked } });
  fill($('#setForm'),
    h('h2', { id: 'setTitle', textContent: firstRun ? 'Bem-vindo ao Stream Deck 👋' : 'Configurações' }),
    h('p', { textContent: firstRun ? 'Escolha o que você quer além da página Principal. Dá para mudar depois em ⚙️ Configurações.' : 'Ligue ou desligue partes do Stream Deck. Vale para o PC e o celular.' }),
    opt('o-games', firstRun ? false : f.games, '🎮 Aba Jogos', 'Mostra todos os jogos instalados no PC (Steam, Epic, Riot, Xbox). Tocar abre o jogo.'),
    opt('o-obs', firstRun ? false : f.obs, '🎬 Página OBS', firstRun || !f.obs ? 'Botões para live, gravação, cena e microfone do OBS.' : 'Desligar apaga a página OBS e os botões dela.'),
    opt('o-widgets', firstRun ? false : f.widgets, '📊 Página Widgets', firstRun || !f.widgets ? 'Teclas ao vivo: relógio, CPU, RAM, GPU, música, volume, cronômetro, contador e clima.' : 'Desligar apaga a página Widgets e os botões dela.'),
    firstRun ? null : h('div', { className: 'preset' },
      h('strong', { textContent: '🧩 Plugins' }),
      h('small', { style: 'display:block;color:var(--muted)', textContent: (server.plugins ?? []).length
        ? `Instalados: ${server.plugins.map((p) => p.name).join(', ')}. Use a ação "Plugin" num botão.`
        : 'Nenhum plugin instalado.' }),
      h('small', { style: 'display:block;color:var(--muted);margin-top:var(--s1)', textContent: 'Para instalar um plugin: copie a pasta dele para a pasta "plugins" do Stream Deck e reinicie o PC.' })),
    preset ? h('div', { className: 'preset' },
      h('strong', { textContent: `⭐ ${preset.name}` }),
      h('small', { style: 'display:block;color:var(--muted)', textContent: `As configurações do criador na versão ${preset.version} (${preset.updatedAt}): ${preset.pages} páginas, ${preset.buttons} botões.` }),
      h('div', { className: 'actions', style: 'justify-content:flex-start' }, h('button', { type: 'button', className: 'btn', textContent: 'Usar o Preset do Criador',
        onclick: () => confirm('Isso troca TODOS os seus botões e páginas pelos do criador. Continuar?') && send({ type: 'applyPreset', name: 'creator' }) }))) : null,
    h('div', { className: 'actions' },
      firstRun ? null : h('button', { className: 'btn', textContent: 'Cancelar', value: 'cancel' }),
      h('button', { type: 'button', className: 'btn primary', textContent: firstRun ? 'Começar' : 'Aplicar', onclick: () => {
        const off = [f.obs && !$('#o-obs').checked && 'OBS', f.widgets && !$('#o-widgets').checked && 'Widgets'].filter(Boolean);
        if (!firstRun && off.length && !confirm(`Desligar apaga a página ${off.join(' e ')} e os botões dela. Continuar?`)) return;
        apply();
      } })));
  // On the first run, closing with Esc still counts as an answer, so the question never comes back.
  $('#setDlg').oncancel = firstRun ? (e) => { e.preventDefault(); apply(); } : null;
  $('#setDlg').showModal();
}

// ---- connection ----
function connect() {
  ws = new WebSocket(`ws://${location.host}/?t=${TOKEN}`);
  ws.onopen = () => { $('#conn').textContent = 'Conectado'; $('#conn').className = 'status on'; document.body.classList.remove('offline'); };
  ws.onclose = () => { $('#conn').textContent = 'Desconectado'; $('#conn').className = 'status'; document.body.classList.add('offline'); setTimeout(connect, 2000); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'history') openHistory(m.items);
    else if (m.type === 'live') {
      live = m.values;
      for (const [id, v] of Object.entries(live)) { const el = document.querySelector(`#grid [data-id="${CSS.escape(id)}"]`); if (el) updateLive(el, v); }
    } else if (m.type === 'config') {
      const wasScanning = server?.scanning;
      fromServer(m.config);
      if (wasScanning && !m.config.scanning && m.config.features?.games) toast(`${m.config.games.length} jogos encontrados`);
      if (!m.config.setupDone && !setupShown) { setupShown = true; openSettings(true); }
    } else if (m.type === 'saved') { pendingSave = false; setDirty(false); toast('Salvo ✅ O celular já foi atualizado.'); }
    else if (m.type === 'error') {
      if (pendingSave && !m.id) { pendingSave = false; setDirty(true); }
      toast(m.error, true);
    }
  };
}

function save() {
  if (!dirty || ws.readyState !== 1) return;
  pendingSave = true;
  setDirty(false); // the incoming config broadcast must replace the draft, not be ignored as a conflict
  ws.send(JSON.stringify({ type: 'save', config: draft }));
}

$('#save').onclick = save;
$('#addApp').onclick = addApp;
$('#rescan').onclick = () => ws.send(JSON.stringify({ type: 'rescan' }));
$('#history').onclick = () => ws.send(JSON.stringify({ type: 'history' }));
$('#settings').onclick = () => server && openSettings();
$('#pair').onclick = () => { $('#pairImg').src = `/api/pair.svg?${Date.now()}`; $('#pairDlg').showModal(); };
window.addEventListener('keydown', (e) => {
  if (recording) return;
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !['INPUT', 'SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); undo(); }
  if (e.key === 'Delete' && sel !== null && pageIdx !== 'games' && !['INPUT', 'SELECT'].includes(document.activeElement.tagName)) change(() => { draft.pages[pageIdx].buttons.splice(sel, 1); sel = null; });
});
window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });
connect();
</script>
</body>
